name: Apply final preview fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-preview-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed final visibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = '<style id="wk-final-preview-fixes">.wk-announcement,.wk-announce,article.wk-card[aria-label*="Икра кеты"],article.wk-card[aria-label*="Chum salmon caviar"]{display:none!important}</style>'
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'wk-final-preview-fixes' not in text:
                  path.write_text(text.replace('</head>', css + '</head>'), encoding='utf-8')
          PY
      - name: Publish fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply final Wild Kamchatka preview fixes"
          git push
