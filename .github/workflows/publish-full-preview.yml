name: Publish full preview

on:
  push:
    branches: [main]
    paths:
      - '.deploy/wk.part.*'
      - '.github/workflows/publish-full-preview.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble full preview
        shell: bash
        run: |
          mkdir -p /tmp/wk-site
          cat .deploy/wk.part.[a-z][a-z] > /tmp/wk-site.tar.gz
          tar -xzf /tmp/wk-site.tar.gz -C /tmp/wk-site
          python3 - <<'PY'
          from pathlib import Path
          css = '<style id="wk-final-preview-fixes">.wk-announcement,.wk-announce,article.wk-card[aria-label*="Икра кеты"],article.wk-card[aria-label*="Chum salmon caviar"]{display:none!important}</style>'
          for path in Path('/tmp/wk-site').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'wk-final-preview-fixes' not in text:
                  path.write_text(text.replace('</head>', css + '</head>'), encoding='utf-8')
          PY
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .deploy -exec rm -rf {} +
          cp -a /tmp/wk-site/. .
          touch .nojekyll
      - name: Publish files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish full Wild Kamchatka preview [skip ci]"
          git push
