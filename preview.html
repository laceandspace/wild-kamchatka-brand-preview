<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wild Kamchatka — полный предпросмотр</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;border:0;width:100%;height:100dvh}</style>
</head>
<body>
<iframe id="site" src="./ru/?v=10" title="Wild Kamchatka"></iframe>
<script>
const frame=document.getElementById('site');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('wk-review-fixes'))return;
    const style=doc.createElement('style');
    style.id='wk-review-fixes';
    style.textContent='.wk-announcement,.wk-announce,article.wk-card[aria-label*="Икра кеты"],article.wk-card[aria-label*="Chum salmon caviar"]{display:none!important}';
    doc.head.appendChild(style);
  }catch(e){}
});
</script>
</body>
</html>
